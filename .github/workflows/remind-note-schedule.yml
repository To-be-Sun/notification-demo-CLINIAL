name: Remind upcoming note posts on Slack

on:
  schedule:
    # 09:00 JST = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remind-note-schedule
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Remind Slack
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID || 'b7bb50d8-eca7-4293-ae56-0dc85be0e9a7' }}
          REMINDER_LOOKAHEAD_DAYS: ${{ vars.REMINDER_LOOKAHEAD_DAYS || '3' }}
          REMINDER_TAG: ${{ vars.REMINDER_TAG || '認知施策' }}
        run: python3 scripts/remind_note_schedule.py

      - name: Commit reminder state
        run: |
          if git diff --quiet -- state/reminded.json; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/reminded.json
          git commit -m "Update reminded note schedule"
          git push
